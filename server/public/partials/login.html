    <section id="loginView" class="login-shell">
      <div class="login-brand">
        <div class="brand-mark">
          <span class="brand-symbol"><i data-lucide="waypoints"></i></span>
          <span class="brand-name">XFCloud Tunnel</span>
        </div>
        <div>
          <h1>服务端访问控制中心</h1>
          <p>统一管理用户权限、端口资源与连接有效期。</p>
        </div>
      </div>
      <div class="login-panel">
        <form id="loginForm" class="login-form">
          <h2>管理员登录</h2>
          <p>进入服务端控制台</p>
          <div class="field">
            <label for="adminUsername">用户名</label>
            <input id="adminUsername" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="adminPassword">密码</label>
            <input
              id="adminPassword"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <p id="loginError" class="error-text" role="alert"></p>
          <button class="button" type="submit">
            <i data-lucide="log-in" class="icon"></i>
            登录
          </button>
        </form>
        <footer class="record-footer login-record">
          <span><a class="footer-brand">XFCloud Tunnel</a></span>
          <a data-icp-link href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="hidden">
            备案信息筹备中
          </a>
        </footer>
      </div>
    </section>
