    <dialog id="passwordDialog">
      <form id="passwordForm">
        <header class="modal-head">
          <h2>修改管理员密码</h2>
          <button class="button ghost icon-only" type="button" data-close-password title="关闭">
            <i data-lucide="x" class="icon"></i>
          </button>
        </header>
        <div class="modal-body">
          <div class="field">
            <label for="currentPassword">当前密码</label>
            <input
              id="currentPassword"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <div class="field">
            <label for="newPassword">新密码</label>
            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <small>长度为 8-128 位</small>
          </div>
          <div class="field">
            <label for="confirmPassword">确认新密码</label>
            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>
          <p id="passwordFormError" class="error-text" role="alert"></p>
          <div class="modal-actions">
            <button class="button secondary" type="button" data-close-password>取消</button>
            <button class="button" type="submit">
              <i data-lucide="save" class="icon"></i>
              更新密码
            </button>
          </div>
        </div>
      </form>
    </dialog>
