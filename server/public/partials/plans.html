        <section id="plansView" class="page-view hidden">
          <header class="topbar">
            <div>
              <h1>套餐管理</h1>
              <p>定义套餐规格，并按套餐批量开通账号</p>
            </div>
            <div class="topbar-actions">
              <button id="batchCreateButton" class="button" type="button">
                <i data-lucide="users-round" class="icon"></i>
                批量开号
              </button>
              <button id="createPlanButton" class="button secondary" type="button">
                <i data-lucide="package-plus" class="icon"></i>
                新建套餐
              </button>
            </div>
          </header>

          <section class="panel">
            <div class="section-head">
              <div>
                <h2>批量开号端口池</h2>
                <p>批量开号时从该端口段内为每个账号分配连续空闲端口；已被占用的端口自动跳过</p>
              </div>
            </div>
            <form id="portPoolForm" class="plan-pool-form">
              <div class="field plan-pool-field">
                <label for="portPoolInput">端口段</label>
                <input id="portPoolInput" placeholder="20000-30000" autocomplete="off" />
                <small id="portPoolMsg">多个端口段用逗号分隔，例如 20000-30000, 31000-32000</small>
              </div>
              <button class="button" type="submit">
                <i data-lucide="save" class="icon"></i>
                保存
              </button>
            </form>
          </section>

          <div id="planCards" class="plan-grid"></div>
          <p id="plansEmpty" class="empty hidden">暂无套餐，点击「新建套餐」创建</p>

          <section class="panel" style="margin-top:24px;">
            <div class="section-head">
              <div>
                <h2>套餐码管理</h2>
                <p>按套餐批量生成 16 位套餐码；客户端登录后输入套餐码即自动绑定对应套餐（时长 + 端口 + 流量）</p>
              </div>
              <button id="planCodeGenerateButton" class="button" type="button">
                <i data-lucide="ticket-plus" class="icon"></i>
                批量生成
              </button>
            </div>
            <form id="planCodeGenerateForm" class="filter-bar hidden" style="flex-wrap:wrap; gap:10px; align-items:flex-end;">
              <div class="field">
                <label for="planCodeNode">目标节点</label>
                <select id="planCodeNode" required></select>
              </div>
              <div class="field">
                <label for="planCodePlanSelect">套餐</label>
                <select id="planCodePlanSelect"></select>
              </div>
              <div class="field">
                <label for="planCodeCount">数量（1-500）</label>
                <input id="planCodeCount" type="number" min="1" max="500" step="1" value="10" />
              </div>
              <button class="button" type="submit">
                <i data-lucide="sparkles" class="icon"></i>
                生成
              </button>
            </form>
            <div class="filter-bar" style="flex-wrap:wrap; gap:10px; align-items:flex-end; margin-top:12px;">
              <div class="field">
                <label for="planCodeStatusFilter">状态</label>
                <select id="planCodeStatusFilter">
                  <option value="">全部</option>
                  <option value="unused">未使用</option>
                  <option value="used">已使用</option>
                  <option value="disabled">已禁用</option>
                </select>
              </div>
              <div class="field">
                <label for="planCodeBatchFilter">批次 ID（选填）</label>
                <input id="planCodeBatchFilter" placeholder="batch-xxx" autocomplete="off" />
              </div>
              <button class="button secondary" type="button" id="planCodeRefresh">
                <i data-lucide="refresh-cw" class="icon"></i>
                刷新
              </button>
              <button class="button secondary" type="button" id="planCodeExport">
                <i data-lucide="download" class="icon"></i>
                导出未使用
              </button>
              <button class="button danger" type="button" id="planCodeDeleteSelected">
                <i data-lucide="trash-2" class="icon"></i>
                删除选中
              </button>
            </div>
            <div class="table-wrap" style="margin-top:12px;">
              <table>
                <thead>
                  <tr>
                    <th class="check-cell">
                      <input type="checkbox" id="planCodeCheckAll" aria-label="全选" />
                    </th>
                    <th>套餐码</th>
                    <th>套餐</th>
                    <th>节点</th>
                    <th>批次</th>
                    <th>状态</th>
                    <th>使用者</th>
                    <th>使用时间</th>
                    <th>生成时间</th>
                  </tr>
                </thead>
                <tbody id="planCodeRows"></tbody>
              </table>
              <div id="planCodesEmpty" class="empty hidden">暂无套餐码</div>
            </div>
          </section>
        </section>
